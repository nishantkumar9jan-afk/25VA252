<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function In JS</title>
</head>
<body>
   <SCRIPT>
function demo () {
        console.log("Hello JS");
    }
     demo();
    
    
    function demo (text) {
        console.log("Hello " + text);
    }
    
    demo("React"); 
    // function with defauilt parameter
    function add (a,b=10) {
        console.log("Addition of " + a + " and " + b + " is: " + (a+b));
    }
    add(5);

    let cal=function() {
        var num1=5;
        var num2=10;
        var res = num1*num2;
        console.log("Multiplication of " + num1 + " and " + num2 + " is: " + res);
    }
    cal();
    let div=(x,y)=>{
        var num1=x;
        var num2=y;
        var res =x/y;
        console.log("Division is "+ res)
    }
    div(12,3);

    //  arrow function with single line statement
    let msg=()=>console.log("Hello ABES");
    msg();
    // callback function :
    
    function sub() {
        var num1=10;
        var num2=5;
        var res = num1-num2;
        callback(res);
    }
    function callback(res) {
        console.log("Subtraction is: " + res);
    }
    sub();

    function msg1() {
        console.log("Hello ABES");
    }
    //   LIFE
    (function(a,b) {
        console.log(`first parameter is ${a} and second parameter is ${b}`);
        var res =a+b;
        console.log(`result is ${res}`);
    })(4,5);
// SHORT CODE USING ARROW FUNCTION
    (msg=>console.log("Hello IIFE"))()
     

   let promise=new Promise(function(resolve,reject){
        let age=25;
        if(age>=18){
          resolve("valid age");
        }
        else{
          reject("wait for the next year")
        }
      });
      // console.log(promise);
      promise.then(msg=>console.log(msg)).catch(error=>console.log(error));

    //   https://dummyjson.com/docs/products
    async function userData() {
        let response=await fetch("https://dummyjson.com/products");
        let  responseData=await response.json();
        console.log(responseData);
    }
    userData();
    // error  handling using try catch
                                                                                                                     
      async function userData() {
      try {
        let response=await fetch('https://dummyjson.com/products');
        let responseData=await response.json();
        console.log(responseData);
      }
    }
    catch(error) {
        console.log("Error: " + error);
    }


    let myinfo={
        name:"Nishant",
        age:19,
        city:"begusarai",
        mobile:1234567890,
        email:"nishant@example.com"
    
    }
    // convert object using stringify
    let myinfoString=JSON.stringify(myinfo);

    // set data
    localStorage.setItem("preference",myinfoString);
    // retriving and parsing the object back
    let getmyinfodata=localStorage.getItem("preference");
    const finalData=JSON.parse(getmyinfodata);
    console.log(finalData);
     
   </SCRIPT> 
</body>
</html>
